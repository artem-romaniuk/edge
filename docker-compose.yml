name: edge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in edge/.env}
      CLOCHE_DOMAIN: ${CLOCHE_DOMAIN:?set CLOCHE_DOMAIN in edge/.env}
      LEDGER_DOMAIN: ${LEDGER_DOMAIN:?set LEDGER_DOMAIN in edge/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      cloche:
        aliases:
          - auth.${CLOCHE_DOMAIN}
      ledger:
        aliases:
          - auth.${CLOCHE_DOMAIN}

networks:
  cloche:
    external: true
    name: cloche_edge
  ledger:
    external: true
    name: ledger_edge

volumes:
  caddy_data:
  caddy_config:
